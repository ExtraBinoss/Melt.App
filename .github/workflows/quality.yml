name: Quality
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'ExtraBinoss/Melt.App' &&
      github.repository_id == '1436787551' &&
      github.actor_id == '113912449' && github.actor == 'ExtraBinoss' &&
      github.triggering_actor == 'ExtraBinoss'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Validate authenticated CI identity
        run: bun scripts/deploy/policy.ts
      - name: Restore Bun package cache
        id: bun_cache
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-
      - run: bun install --frozen-lockfile
      - name: Retain installed packages before later checks
        if: steps.bun_cache.outputs.cache-hit != 'true' && steps.bun_cache.outputs.cache-primary-key != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Check generated Worker bindings
        run: |
          mkdir -p artifacts/cloudflare/site
          bunx --no-install wrangler types apps/web/src/platform/cloudflare/worker-configuration.d.ts --env production --include-runtime false
          bunx oxfmt apps/web/src/platform/cloudflare/worker-configuration.d.ts
          git diff --exit-code -- apps/web/src/platform/cloudflare/worker-configuration.d.ts
      - name: Verify versions and contribution rules
        run: bun run version:check && bun run check:rules
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Build and prerender production pages
        run: bunx --no-install vite build
      - name: Prepare Cloudflare static package
        run: bun run deploy:prepare
      - name: Validate Cloudflare configuration without publishing
        run: bun run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Install the native deployment witness
        run: bunx playwright install --with-deps chromium
      - name: Verify local Cloudflare HTTP and WASM delivery
        run: bun run test:deployment
      - name: Retain the verified production artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-${{ github.sha }}
          path: |
            artifacts/cloudflare/site/
            artifacts/cloudflare/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy:
    needs: verify
    if: >-
      github.repository == 'ExtraBinoss/Melt.App' &&
      github.repository_id == '1436787551' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor_id == '113912449' && github.actor == 'ExtraBinoss' &&
      github.triggering_actor == 'ExtraBinoss'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: write
    environment:
      name: cloudflare-production
      url: https://melt.plinka.eu
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Restore Bun package cache
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-
      - run: bun install --frozen-lockfile
      - name: Validate authenticated production identity
        run: bun scripts/deploy/policy.ts --production
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-${{ github.sha }}
          path: artifacts/cloudflare
      - name: Verify artifact commit and integrity
        run: bun run deploy:verify
      - name: Reject a superseded main commit
        run: test "$(gh api repos/ExtraBinoss/Melt.App/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the verified static site
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bunx --no-install wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
