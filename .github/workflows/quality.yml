name: Quality
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'ExtraBinoss/Melt.App' &&
      github.repository_id == '1436787551' &&
      github.actor_id == '113912449' && github.actor == 'ExtraBinoss' &&
      github.triggering_actor == 'ExtraBinoss'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Validate authenticated CI identity
        run: bun scripts/deploy/policy.ts
      - name: Install template video metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffprobe -version
      - run: bun install --frozen-lockfile
      - name: Check generated Worker bindings
        run: |
          mkdir -p artifacts/cloudflare/site
          bunx --no-install wrangler types apps/web/src/platform/cloudflare/worker-configuration.d.ts --env production --include-runtime false
          bunx oxfmt apps/web/src/platform/cloudflare/worker-configuration.d.ts
          git diff --exit-code -- apps/web/src/platform/cloudflare/worker-configuration.d.ts
      - name: Verify without browser scenarios
        run: bun run check-ci
      - name: Prepare Cloudflare static package
        run: bun run deploy:prepare
      - name: Validate Cloudflare configuration without publishing
        run: bun run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Install the native deployment witness
        run: bunx playwright install --with-deps chromium
      - name: Verify local Cloudflare HTTP and WASM delivery
        run: bun run test:deployment
      - name: Retain the verified production artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-${{ github.sha }}
          path: |
            artifacts/cloudflare/site/
            artifacts/cloudflare/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-reports
          path: coverage/
          retention-days: 7

  deploy:
    needs: verify
    if: >-
      github.repository == 'ExtraBinoss/Melt.App' &&
      github.repository_id == '1436787551' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor_id == '113912449' && github.actor == 'ExtraBinoss' &&
      github.triggering_actor == 'ExtraBinoss'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: write
    environment:
      name: cloudflare-production
      url: https://melt.plinka.eu
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Validate authenticated production identity
        run: bun scripts/deploy/policy.ts --production
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloudflare-${{ github.sha }}
          path: artifacts/cloudflare
      - name: Verify artifact commit and integrity
        run: bun run deploy:verify
      - name: Reject a superseded main commit
        run: test "$(gh api repos/ExtraBinoss/Melt.App/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the verified static site
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bunx --no-install wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
